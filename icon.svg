<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Visualiseur METAR/TAF">
  <!-- Fond plein (pour "maskable" : zone safe centrale) -->
  <rect width="512" height="512" fill="#020617"/>

  <!-- Cercle boussole / horizon -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#38BDF8" stroke-width="14"/>
  <circle cx="256" cy="256" r="150" fill="#0B1220"/>

  <!-- Graduations cardinales -->
  <g stroke="#94A3B8" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="120" x2="256" y2="150"/>
    <line x1="256" y1="362" x2="256" y2="392"/>
    <line x1="120" y1="256" x2="150" y2="256"/>
    <line x1="362" y1="256" x2="392" y2="256"/>
  </g>

  <!-- Secteur ciel (bleu) / sol (rouge) style horizon artificiel -->
  <path d="M 150 256 A 106 106 0 0 1 362 256 Z" fill="#1976D2" opacity="0.55"/>
  <path d="M 150 256 A 106 106 0 0 0 362 256 Z" fill="#BF360C" opacity="0.55"/>

  <!-- Ligne d'horizon -->
  <line x1="146" y1="256" x2="366" y2="256" stroke="#E2E8F0" stroke-width="6"/>

  <!-- Flèche vent ( axe principal NE) -->
  <g stroke="#FACC15" stroke-width="14" stroke-linecap="round" fill="none">
    <line x1="196" y1="316" x2="316" y2="196"/>
  </g>
  <polygon points="316,196 300,188 308,204" fill="#FACC15"/>
  <circle cx="196" cy="316" r="10" fill="#FACC15"/>

  <!-- Nuage stylisé (Météo) en haut -->
  <g fill="#E2E8F0">
    <path d="M 176 96 q 0 -34 34 -34 q 12 -22 38 -16 q 24 -18 50 6 q 28 -2 30 28 q 22 4 14 26 l -158 0 q -14 -2 -8 -10 Z" opacity="0.95"/>
  </g>

  <!-- Étiquette texte -->
  <text x="256" y="470" font-family="'DM Mono', ui-monospace, monospace" font-size="46" font-weight="700"
        fill="#E2E8F0" text-anchor="middle" letter-spacing="2">METAR</text>
</svg>
